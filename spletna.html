
<!DOCTYPE html>
<html lang="sl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Prijava</title>

  <style>
    :root {
      --bg: #061A40;
      --card: #0B2545;
      --text: #ffffff;
      --muted: #b8cce5;
      --line: #29476b;
      --accent: #1565C0;
      --accent-dark: #0D47A1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    .login {
      width: 100%;
      max-width: 360px;
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    }

    h1 {
      margin: 0 0 1.5rem;
      font-size: 1.5rem;
      color: white;
    }

    label {
      display: block;
      margin-bottom: .35rem;
      font-size: .9rem;
      color: var(--muted);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: .65rem .75rem;
      margin-bottom: 1.1rem;
      border: 1px solid var(--line);
      border-radius: 6px;
      font-size: 1rem;
      color: white;
      background: #102F52;
    }

    input:focus-visible,
    button:focus-visible {
      outline: 3px solid #64B5F6;
      outline-offset: 2px;
    }

    .show {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin: -.4rem 0 1.25rem;
      font-size: .9rem;
      color: var(--muted);
    }

    .show label {
      margin: 0;
    }

    button {
      width: 100%;
      padding: .75rem;
      border: 0;
      border-radius: 6px;
      background: var(--accent);
      color: white;
      font-size: 1rem;
      cursor: pointer;
    }

    button:hover {
      background: var(--accent-dark);
    }

    #sporocilo {
      min-height: 1.3em;
      margin: 1rem 0 0;
      font-size: .9rem;
      color: var(--muted);
    }
  </style>
</head>

<body>

  <main class="login">
    <h1>Prijava</h1>

    <form id="prijava" autocomplete="on">

      <label for="username">Uporabniško ime</label>
      <input
        type="text"
        id="username"
        name="username"
        autocomplete="username"
        required
      >

      <label for="password">Geslo</label>
      <input
        type="password"
        id="password"
        name="password"
        autocomplete="current-password"
        required
      >

      <div class="show">
        <input type="checkbox" id="pokazi">
        <label for="pokazi">Pokaži geslo</label>
      </div>

      <button type="submit">Prijavi se</button>

      <p id="sporocilo" role="status"></p>

    </form>
  </main>

  <script>
    
const form = document.getElementById("prijava");
const geslo = document.getElementById("password");
const sporocilo = document.getElementById("sporocilo");

document.getElementById("pokazi").addEventListener("change", function () {
    geslo.type = this.checked ? "text" : "password";
});

form.addEventListener("submit", async function (e) {
    e.preventDefault();

    const uporabnik = document.getElementById("username").value;
    const password = geslo.value;

    sporocilo.textContent = "Pošiljanje prijave ...";

    try {
        const odgovor = await fetch("/api/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                username: uporabnik,
                password: password
            })
        });

        const rezultat = await odgovor.json();

        if (odgovor.ok) {
            sporocilo.textContent = "Prijava uspešna!";
        } else {
            sporocilo.textContent = rezultat.message || "Prijava ni uspela.";
        }

    } catch (napaka) {
        sporocilo.textContent = "Napaka pri povezavi s strežnikom.";
    }
    });

  </script>

</body>
</html>
